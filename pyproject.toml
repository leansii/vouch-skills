[project]
name = "vouch-skills"
version = "0.2.1"
description = "Vouch: honest, job-tailored resumes as an Agent Skill (scripts are stdlib-only)"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]  # scripts add their own dir to sys.path before importing vouch_common

[tool.pytest.ini_options]
testpaths = ["tests"]
